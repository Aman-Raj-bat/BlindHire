<svg width="128" height="128" viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">BlindHire mark</title>
  <desc id="desc">A hand-drawn orbit around a private signal</desc>
  <!-- An intentionally uneven orbit: private work should feel human, not machine stamped. -->
  <path d="M20 72C27 47 47 27 71 21C91 16 108 23 113 38C117 50 110 61 101 67" stroke="#11162B" stroke-width="6" stroke-linecap="round"/>
  <path d="M14 70C28 91 51 105 76 106C96 107 111 98 114 84" stroke="#11162B" stroke-width="6" stroke-linecap="round"/>
  <path d="M13 65C32 48 58 42 81 47C101 51 114 62 115 75C115 81 112 85 108 89" stroke="#B6422F" stroke-width="5" stroke-linecap="round"/>
  <!-- The signal is an open eye, not a shield: BlindHire protects the person behind the proof. -->
  <path d="M39 66C47 54 58 49 70 50C83 51 94 57 101 67C93 76 83 81 71 81C58 81 47 76 39 66Z" fill="#11162B"/>
  <path d="M52 67C57 60 64 57 71 58C77 59 82 62 86 67C81 72 76 75 70 75C63 75 57 72 52 67Z" stroke="#FFFDF8" stroke-width="3.5" stroke-linecap="round"/>
  <circle cx="70" cy="67" r="5.5" fill="#C8EF83"/>
  <circle cx="18" cy="93" r="4" fill="#FF7352"/>
</svg>
